name: Deploy Supabase (migrations + edge functions)

# WHY THIS EXISTS
#
# This repo has two writers: Lovable's editor, and Claude sessions pushing
# through git. On 2026-08-18 a live probe showed the consequence: every edge
# function and migration merged via git — the incident-gate privacy fix, the
# news-freshness repair, six crawler-serving functions, ten cron schedules —
# had NEVER reached production. Lovable deploys only what passes through its
# own pipeline; a git merge was silently a no-op in production.
#
# This workflow closes that gap permanently:
#   - every push to main touching supabase/** deploys automatically
#   - workflow_dispatch allows an on-demand run
#
# It needs ONE repository secret: SUPABASE_ACCESS_TOKEN
#   (supabase.com dashboard -> Account -> Access Tokens -> Generate new token)
# The token drives both halves: SQL through the Management API, and function
# deploys through the CLI. No database password is stored anywhere.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "docs/apply-pending-migrations.sql"
      - ".github/workflows/deploy-supabase.yml"

# One deploy at a time; a queued push waits for the running one rather than
# racing it through the Management API and the functions CLI.
concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: mzumvkrpnxhkvhdyzgqa
    steps:
      - uses: actions/checkout@v4

      - name: Guard - secret present
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set. Create one at supabase.com -> Account -> Access Tokens, then add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      # ---------------------------------------------------------------
      # 1. SQL: run the consolidated idempotent migration file through the
      #    Management API (the same endpoint the dashboard SQL editor uses).
      #    The file is deliberately safe to re-run — every statement is
      #    guarded — so this step is idempotent across workflow runs.
      # ---------------------------------------------------------------
      - name: Apply pending migrations (idempotent)
        run: |
          set -e
          jq -Rs '{query: .}' docs/apply-pending-migrations.sql > /tmp/body.json
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data @/tmp/body.json)
          echo "management api: $code"
          head -c 2000 /tmp/resp.json; echo
          if [ "$code" -ge 400 ]; then
            echo "::error::migration SQL failed ($code) — see response above"
            exit 1
          fi

      - name: Verify schema landed
        run: |
          set -e
          q() {
            jq -n --arg q "$1" '{query: $q}' > /tmp/q.json
            curl -sS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" --data @/tmp/q.json
          }
          echo "city_config exists:"; q "SELECT to_regclass('public.city_config') IS NOT NULL AS ok"
          echo "publish_date trigger:"; q "SELECT count(*) FROM pg_trigger WHERE tgname LIKE '%publish_date%'"
          echo "cron jobs:"; q "SELECT jobname FROM cron.job ORDER BY jobname"

      # ---------------------------------------------------------------
      # 2. Edge functions: deploy EVERYTHING under supabase/functions/.
      #    The CLI reads supabase/config.toml, so each function keeps its
      #    declared verify_jwt setting (the crawler-facing ones are public).
      # ---------------------------------------------------------------
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all edge functions
        run: |
          set -e
          failed=""
          for dir in supabase/functions/*/; do
            fn=$(basename "$dir")
            [ "$fn" = "_shared" ] && continue
            echo "--- deploying $fn"
            if ! supabase functions deploy "$fn" --project-ref "$PROJECT_REF"; then
              failed="$failed $fn"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::functions failed to deploy:$failed"
            exit 1
          fi

      # Probe with OPTIONS, never GET: a GET actually RUNS these functions
      # (run #3's probe triggered a real Zillow refresh and an IndexNow
      # submission), and serve-page's router answers a bare GET with its own
      # 404 — which this step once misread as "function missing" and failed a
      # fully successful deploy. Every function answers the CORS preflight
      # with 200 if it exists; only the platform 404s.
      - name: Verify functions are live
        run: |
          set -e
          for fn in serve-sitemap serve-page submit-indexnow refresh-real-estate-metrics; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" -X OPTIONS \
              "https://$PROJECT_REF.supabase.co/functions/v1/$fn")
            echo "$fn OPTIONS -> $code"
            if [ "$code" = "404" ]; then
              echo "::error::$fn still 404 after deploy"
              exit 1
            fi
          done
          # One real render proves the crawler path end to end (no side effects:
          # serve-page only reads).
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://$PROJECT_REF.supabase.co/functions/v1/serve-page?path=/today")
          echo "serve-page?path=/today -> $code"
          if [ "$code" != "200" ]; then
            echo "::error::serve-page failed to render /today ($code)"
            exit 1
          fi
          echo "All probes passed — production now matches the repo."
