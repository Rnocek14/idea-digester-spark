  <!--
    description / og:title / og:description / og:url / og:type /
    twitter:title / twitter:description are set per-page by
    src/components/PageMeta.tsx (react-helmet-async). They are deliberately NOT
    hardcoded here: helmet APPENDS rather than replaces, and social crawlers
    read the FIRST matching tag — so a static copy here wins and every shared
    link previews as the generic site card.

    This bit us for real: og:url was pinned to "https://lakegenevabrief.com/",
    so every one of the ~40 indexed pages advertised the homepage URL in link
    previews, and the static description shadowed every per-page one. Every
    indexed route renders PageMeta (the pages that don't are admin-only or
    noindex), so there is nothing left for these defaults to catch.

    og:image and og:site_name DO stay: PageMeta sets og:image only when a page
    supplies one, and never sets og:site_name.
    tests/seo/meta.test.ts enforces both halves of this.
  -->
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"NewsMediaOrganization","name":"Lake Geneva Brief","url":"https://lakegenevabrief.com/","logo":"https://storage.googleapis.com/gpt-engineer-file-uploads/SvWZJGynpjYPoF316Lv9RVB7o2F2/uploads/1764815751185-ChatGPT%20Image%20Dec%203%2C%202025%2C%2007_15_47%20PM.png","sameAs":["https://twitter.com/LakeGenevaBrief"],"areaServed":{"@type":"Place","name":"Lake Geneva, Wisconsin"}}
  </script>
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"WebSite","name":"Lake Geneva Brief","url":"https://lakegenevabrief.com/"}
  </script>
</head>
