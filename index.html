  <head>
    <meta charset="UTF-8" />

    <title>Lake Geneva Brief – Local News, Simplified</title>
    <meta name="description" content="Lake Geneva Brief is the five-minute local newsletter covering city hall, schools, business, dining, and events in Lake Geneva.">
    <meta name="author" content="Lake Geneva Brief" />
    <meta name="google-site-verification" content="sZy4jbEYRn2Fr3PfUoiEmQ2IuvqOKI8TFacvteY83KY" />
    <meta name="google-site-verification" content="q_Hmondkzx1T9qYJEcYZmEmaMzDvI-qqtGemogLSaNw" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="https://storage.googleapis.com/gpt-engineer-file-uploads/SvWZJGynpjYPoF316Lv9RVB7o2F2/uploads/1764815751185-ChatGPT Image Dec 3, 2025, 07_15_47 PM.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Loaded non-blocking: the stylesheet no longer delays first paint;
         display=swap paints text with a system fallback until it arrives. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    </noscript>

    <!-- Image CDN preconnects -->
    <link rel="preconnect" href="https://images.unsplash.com">
    <link rel="preconnect" href="https://storage.googleapis.com">

    
    
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lakegenevabrief.com/" />
    <meta property="og:site_name" content="Lake Geneva Brief" />
    <meta property="og:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/SvWZJGynpjYPoF316Lv9RVB7o2F2/social-images/social-1764815719524-ChatGPT Image Dec 3, 2025, 07_21_23 PM.png">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@LakeGenevaBrief" />
    <meta name="twitter:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/SvWZJGynpjYPoF316Lv9RVB7o2F2/social-images/social-1764815719524-ChatGPT Image Dec 3, 2025, 07_21_23 PM.png">
    
  
  
  
  <!--
    og:title / og:description / twitter:title / twitter:description are set
    per-page by src/components/PageMeta.tsx (react-helmet-async). They are
    deliberately NOT hardcoded here: helmet appends rather than replaces, and
    social crawlers read the FIRST matching tag — so a static copy here would
    win and every shared link would preview as the generic site card.
    og:image / og:site_name / og:type / og:url stay as defaults because
    PageMeta only overrides them when a page supplies its own.
  -->
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"NewsMediaOrganization","name":"Lake Geneva Brief","url":"https://lakegenevabrief.com/","logo":"https://storage.googleapis.com/gpt-engineer-file-uploads/SvWZJGynpjYPoF316Lv9RVB7o2F2/uploads/1764815751185-ChatGPT%20Image%20Dec%203%2C%202025%2C%2007_15_47%20PM.png","sameAs":["https://twitter.com/LakeGenevaBrief"],"areaServed":{"@type":"Place","name":"Lake Geneva, Wisconsin"}}
  </script>
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"WebSite","name":"Lake Geneva Brief","url":"https://lakegenevabrief.com/"}
  </script>
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
